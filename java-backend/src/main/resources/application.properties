spring.application.name=pokedex-backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pokedex}
spring.datasource.username=${DB_USERNAME:pokedex}
spring.datasource.password=${DB_PASSWORD:pokedex}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.origin=${CORS_ORIGIN:http://localhost:5000}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
