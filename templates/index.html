<!DOCTYPE html>
<html>
<head>
    <title>Pokédex Search</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark text-white">
<div class="container mt-5 text-center">
    <h1 class="mb-4">Pokédex</h1>

    <a href="/history" class="btn btn-info mb-3">View Search History</a>
    <a href="/compare" class="btn btn-warning mb-3">Compare Pokémon</a>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="pokemon" class="form-control mb-3"
               placeholder="Enter Pokémon name..." required>
        <button class="btn btn-primary btn-lg">Search</button>
    </form>
</div>
</body>
</html>
