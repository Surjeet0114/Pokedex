{% extends 'base.html' %}
{% block title %}
History
{% endblock %}
{% block content %}
<div class="container py-5">
<h1>
Search History
</h1>
<div class="card p-3">
<div class="table-responsive">
<table class="table table-dark">
<thead>
<tr>
<th>
Pokémon
</th>
<th>
ID
</th>
<th>
Types
</th>
<th>
Time
</th>
</tr>
</thead>
<tbody>
{% for x in history %}
<tr>
<td>
{{ x.pokemonName }}
</td>
<td>
{{ x.pokemonId }}
</td>
<td>
{{ x.types }}
</td>
<td>
{{ x.searchedAt }}
</td>
</tr>
{% else %}
<tr>
<td colspan="4">
No history yet.
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
</div>
</div>
{% endblock %}
